<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1f2937" />
		<title>Peta QGIS</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIINfQ3Hym5y6V8v3t8V6z6Q5j7w5h5W5WQ="
			crossorigin=""
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			#map {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: #e5e7eb;
			}
		</style>
	</head>
	<body>
		<div id="map" aria-label="Peta interaktif"></div>

		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script>
			const map = L.map("map", {
				center: [-6.88359, 107.916],
				zoom: 13,
				minZoom: 12,
				maxZoom: 16,
				zoomControl: true,
			});

			L.tileLayer("./{z}/{x}/{y}.jpg", {
				minZoom: 12,
				maxZoom: 16,
				tms: false,
				attribution: "Created by QGIS",
				tileSize: 256,
			}).addTo(map);

			// Fix Leaflet tile misalignment on initial load
			setTimeout(function () {
				map.invalidateSize();
			}, 100);
		</script>
	</body>
</html>
