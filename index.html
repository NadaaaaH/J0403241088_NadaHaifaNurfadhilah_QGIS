<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1f2937" />
		<title>Peta QGIS</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			crossorigin=""
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			#map {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: #e5e7eb;
			}

			.map-title {
				position: fixed;
				top: 18px;
				left: 50%;
				z-index: 1000;
				transform: translateX(-50%);
				max-width: calc(100% - 96px);
				padding: 10px 18px;
				border: 1px solid rgba(255, 255, 255, 0.8);
				border-radius: 8px;
				background: rgba(255, 255, 255, 0.92);
				box-shadow: 0 4px 14px rgba(31, 41, 55, 0.2);
				color: #1f2937;
				font: 700 16px/1.3 Georgia, serif;
				letter-spacing: 0;
				text-align: center;
				pointer-events: none;
			}

			@media (max-width: 480px) {
				.map-title {
					top: 12px;
					max-width: calc(100% - 72px);
					padding: 8px 12px;
					font-size: 14px;
				}
			}
		</style>
	</head>
	<body>
		<div id="map" aria-label="Peta interaktif"></div>
		<h1 class="map-title">Tempat-tempat berarti bagiku di Sumedang</h1>

		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script>
			const map = L.map("map", {
				center: [-6.88359, 107.916],
				zoom: 13,
				minZoom: 12,
				maxZoom: 16,
				zoomControl: true,
			});

			L.tileLayer("/{z}/{x}/{y}.jpg", {
				minZoom: 12,
				maxZoom: 16,
				tms: false,
				attribution: "Created by QGIS",
				tileSize: 256,
			}).addTo(map);

			// Fix Leaflet tile misalignment on initial load
			setTimeout(function () {
				map.invalidateSize();
			}, 100);
		</script>
	</body>
</html>
